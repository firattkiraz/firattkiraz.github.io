<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perfect Fit Puzzle - Redirecting...</title>

<script>
window.addEventListener('load', function() {

    const ua = navigator.userAgent || navigator.vendor || window.opera;

    let destination = "";
    let platform = "desktop";

    if (/android/i.test(ua)) {

        platform = "android";
        destination = "https://play.google.com/store/apps/details?id=com.FathaGames.PerfectFit";

    } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {

        platform = "ios";
        destination = "https://apps.apple.com/us/app/perfect-fit-puzzle/id6772202390";

    } else {

        platform = "desktop";
        destination = "https://www.fathagames.com/#games";
    }

    // 🔥 META PIXEL EVENT (EN ÖNEMLİ EKLEME)
    fbq('track', 'ViewContent', {
        content_name: 'qr_redirect',
        platform: platform
    });

    // GA event
    gtag('event', 'qr_redirect', {
        platform: platform,
        source: 'qr'
    });

    // daha güvenli redirect (pixel kaçmasın diye)
    setTimeout(function() {
        window.location.replace(destination);
    }, 800);

});
</script>
