<!DOCTYPE html>
<html lang="en">
<head>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-B9GTDBWJPV"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-B9GTDBWJPV');
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecting...</title>

<script>
window.addEventListener('load', function() {

    const ua = navigator.userAgent || navigator.vendor || window.opera;

    let destination = "";
    let platform = "desktop";

    if (/android/i.test(ua)) {

        platform = "android";
        destination = "https://play.google.com/store/apps/details?id=com.FathaGames.PerfectFit";

    } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {

        platform = "ios";
        destination = "https://apps.apple.com/us/app/perfect-fit-puzzle/id6772202390";

    } else {

        platform = "desktop";
        destination = "https://www.fathagames.com/#games";
    }

    // Analytics event
    gtag('event', 'qr_redirect', {
        platform: platform,
        source: 'qr'
    });

    // Event'in gönderilmesi için kısa bekleme
    setTimeout(function() {
        window.location.replace(destination);
    }, 300);

});
</script>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    color:#555;
}
</style>

</head>

</html>
