<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatha Games</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* BASE */
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,system-ui;
  background:#fff;
  color:#0e1320;
}

a{text-decoration:none; color:inherit;}

.container{
  width:min(1100px,90%);
  margin:auto;
}

/* HERO */
.hero{
  text-align:center;
  padding:70px 0 40px;
}

.hero-logo{width:300px; max-width:85%;}
.hero h1{font-size:44px; margin:0;}
.hero p{color:rgba(0,0,0,0.6);}

/* DIVIDER */
.divider{
  display:flex;
  align-items:center;
  gap:18px;
  margin:50px 0;
}

.divider-line{
  flex:1;
  height:1px;
  background:rgba(0,0,0,0.08);
}

.divider img{width:24px; opacity:.6;}

/* SECTION */
.section{
  text-align:center;
  padding:40px 0;
}

.section h2{font-size:38px; margin-bottom:25px;}

/* GAME */
.game-logo{width:240px; max-width:80%;}

/* STORE */
.store-buttons{
  display:flex;
  justify-content:center;
  gap:22px; /* 🔥 increased spacing */
  flex-wrap:wrap;
  margin-bottom:35px; /* 🔥 extra space before video */
}

.store-btn{
  transition:transform .25s ease;
}

.store-btn:hover{
  transform:translateY(-4px);
}

.store-btn img{
  height:52px !important;
  width:auto;
  display:block;
}

/* YOUTUBE PHONE STYLE CARD */
.video-wrapper{
  width:100%;
  max-width:380px; /* phone feel */
  margin:0 auto;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  border:6px solid #111; /* phone frame */
  background:#000;
}

.video-wrapper iframe{
  width:100%;
  aspect-ratio:9/16; /* SHORTS phone style */
  border:0;
}

/* SOCIALS FIX (VISIBLE ICONS) */
.socials{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:15px;
}

.socials a{
  width:46px;
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.05);
  border-radius:14px;
  transition:.25s;
}

.socials svg{
  width:22px;
  height:22px;
  fill:#0e1320;
}

.socials a:hover{
  transform:translateY(-3px);
}

.socials a:nth-child(1):hover{background:#FF0000;}
.socials a:nth-child(2):hover{background:#E1306C;}
.socials a:nth-child(3):hover{background:#1877F2;}

.socials a:hover svg{fill:#fff;}

/* FOOTER */
.footer{
  margin-top:60px;
  padding:30px 0;
  border-top:1px solid rgba(0,0,0,0.08);
  display:flex;
  justify-content:space-between;
  font-size:13px;
  opacity:.7;
}

/* FIX */
img,svg{max-width:100%; height:auto;}

</style>

</head>

<body>

<main class="container">

<!-- HERO -->
<section class="hero">
  <img class="hero-logo" src="assets/brand/fatha-f.png">
  <h1>Fatha Games</h1>
  <p>We build games with focus on feel, clarity, and execution.</p>
</section>

<div class="divider">
  <div class="divider-line"></div>
  <img src="assets/brand/fatha-f.png">
  <div class="divider-line"></div>
</div>

<!-- GAME -->
<section class="section">

  <h2>Perfect Fit</h2>

  <img class="game-logo" src="assets/games/perfect-fit/logo.png">

  <!-- STORE -->
  <div class="store-buttons">

    <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.FathaGames.PerfectFit">
      <img src="assets/google-play.png">
    </a>

    <a class="store-btn" href="https://apps.apple.com/us/app/perfect-fit-puzzle/id6772202390">
      <img src="assets/app-store.png">
    </a>

  </div>

  <!-- VIDEO (PHONE STYLE) -->
  <div class="video-wrapper">
    <iframe src="https://www.youtube.com/embed/l2f48ydpf9c" allowfullscreen></iframe>
  </div>

</section>

<div class="divider">
  <div class="divider-line"></div>
  <img src="assets/brand/fatha-f.png">
  <div class="divider-line"></div>
</div>

<!-- CONTACT -->
<section class="section">

<h2>Contact</h2>
<p>info@fathagames.com</p>

<div class="socials">

  <!-- YouTube -->
  <a href="https://youtube.com/@fathagames" target="_blank">
    <svg viewBox="0 0 24 24">
      <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5S4.5 3.5 2.6 4.1A3 3 0 0 0 .5 6.2 31.5 31.5 0 0 0 0 12a31.5 31.5 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1C4.5 20.5 12 20.5 12 20.5s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.5 31.5 0 0 0 24 12a31.5 31.5 0 0 0-.5-5.8zM9.5 15.5v-7l6.3 3.5-6.3 3.5z"/>
    </svg>
  </a>

  <!-- Instagram -->
  <a href="https://instagram.com/fatha.games" target="_blank">
    <svg viewBox="0 0 24 24">
      <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm5 5.5A5.5 5.5 0 1 0 17.5 13 5.5 5.5 0 0 0 12 7.5z"/>
    </svg>
  </a>

  <!-- Facebook -->
  <a href="https://facebook.com/share/1Di7zF4rcD/" target="_blank">
    <svg viewBox="0 0 24 24">
      <path d="M22 12a10 10 0 1 0-10 10v-7h-2v-3h2v-2c0-2 1-3 3-3h2v3h-2c-1 0-1 .5-1 1v1h3l-1 3h-2v7a10 10 0 0 0 8-9z"/>
    </svg>
  </a>

</div>

</section>

<!-- FOOTER -->
<footer class="footer container">
  <div>© 2026 Fatha Games</div>
  <div>
    <a href="privacy.html">Privacy</a> •
    <a href="terms.html">Terms</a>
  </div>
</footer>

</main>

</body>
</html>
