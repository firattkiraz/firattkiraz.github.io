<!DOCTYPE html>
<html lang="en">
<head>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-B9GTDBWJPV"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-B9GTDBWJPV');
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatha Games</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* RESET */
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:#fff;
  color:#0e1320;
}

a{color:inherit; text-decoration:none;}

.container{
  width:min(1100px,90%);
  margin:auto;
}

/* TOPBAR */
.topbar{
  position:sticky;
  top:0;
  background:#fff;
  border-bottom:1px solid rgba(0,0,0,0.08);
  z-index:10;
}

.topbar-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
}

.nav{
  display:flex;
  gap:20px;
  font-size:14px;
  opacity:.7;
}

/* HERO */
.hero{
  text-align:center;
  padding:70px 0 40px;
}

.hero-logo{
  width:300px;
  max-width:85%;
}

.hero h1{
  font-size:44px;
  margin:0;
}

.hero p{
  margin-top:10px;
  color:rgba(0,0,0,0.6);
}

/* DIVIDER */
.divider{
  display:flex;
  align-items:center;
  gap:18px;
  margin:50px 0;
}

.divider-line{
  height:1px;
  flex:1;
  background:rgba(0,0,0,0.08);
}

.divider img{
  width:24px;
  opacity:.6;
}

/* SECTION */
.section{
  text-align:center;
  padding:40px 0;
}

.section h2{
  font-size:38px;
  margin-bottom:25px;
}

/* GAME */
.game-logo{
  width:240px;
  max-width:80%;
  margin-bottom:15px;
}

/* STORE BUTTONS */
.store-buttons{
  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
}

.store-btn{
  display:inline-block;
  transition:transform .25s ease;
}

.store-btn:hover{
  transform:translateY(-4px);
}

.store-btn img{
  height:52px !important;
  width:auto !important;
  object-fit:contain;
  display:block;
}
<!-- YOUTUBE VIDEO -->
<div class="video-wrapper">
  <iframe
    src="https://www.youtube.com/embed/l2f48ydpf9c"
    title="Gameplay Video"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>
</div>
/* SOCIALS */
.socials{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:15px;
}

.socials a{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.05);
  border-radius:12px;
  transition:all .25s ease;
}

.socials svg{
  width:20px;
  height:20px;
  fill:#0e1320;
  transition:fill .25s ease;
}

.socials a:hover{
  transform:translateY(-3px);
}

.socials a:nth-child(1):hover{ background:#FF0000; }
.socials a:nth-child(2):hover{ background:#E1306C; }
.socials a:nth-child(3):hover{ background:#1877F2; }

.socials a:hover svg{
  fill:#fff;
}

/* FOOTER */
.footer{
  margin-top:60px;
  padding:30px 0;
  border-top:1px solid rgba(0,0,0,0.08);
  display:flex;
  justify-content:space-between;
  font-size:13px;
  opacity:.7;
}

/* GLOBAL FIX */
img, svg{
  max-width:100%;
  height:auto;
}
.video-wrapper{
  width:100%;
  max-width:520px;
  margin:20px auto 0;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* 16:9 ratio */
.video-wrapper iframe{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  display:block;
}
</style>

<script>

/* store tracking */
function trackStore(type,url){
  gtag('event','click_store',{platform:type});
  window.open(url,'_blank');
}

/* QR tracking */
(function(){
  const p = new URLSearchParams(window.location.search);
  if(p.get("utm_source")==="qr"){
    gtag('event','qr_visit',{
      campaign:p.get("utm_campaign")||"unknown"
    });
  }
})();
</script>

</head>

<body>

<!-- TOP -->
<header class="topbar">
  <div class="container topbar-inner">
    <div><b>Fatha Games</b></div>
    <nav class="nav">
      <a href="#games">Games</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main class="container">

<!-- HERO -->
<section class="hero">
  <img class="hero-logo" src="assets/brand/fatha-f.png">
  <h1>Fatha Games</h1>
  <p>We build games with focus on feel, clarity, and execution.</p>
</section>

<!-- DIVIDER -->
<div class="divider">
  <div class="divider-line"></div>
  <img src="assets/brand/fatha-f.png">
  <div class="divider-line"></div>
</div>

<!-- GAMES -->
<section class="section" id="games">
  <h2>Games</h2>

  <div>Perfect Fit</div>

  <img class="game-logo" src="assets/games/perfect-fit/logo.png">

  <div class="store-buttons">

    <a class="store-btn"
       href="javascript:void(0)"
       onclick="trackStore('android','https://play.google.com/store/apps/details?id=com.FathaGames.PerfectFit')">
      <img src="assets/google-play.png">
    </a>

    <a class="store-btn"
       href="javascript:void(0)"
       onclick="trackStore('ios','https://apps.apple.com/us/app/perfect-fit-puzzle/id6772202390')">
      <img src="assets/app-store.png">
    </a>

  </div>
</section>

<!-- DIVIDER -->
<div class="divider">
  <div class="divider-line"></div>
  <img src="assets/brand/fatha-f.png">
  <div class="divider-line"></div>
</div>

<!-- ABOUT -->
<section class="section" id="about">
  <h2>About</h2>
  <p style="color:rgba(0,0,0,0.6); line-height:1.8;">
    We focus on feel, clarity and execution in game development.
  </p>
</section>

<!-- DIVIDER -->
<div class="divider">
  <div class="divider-line"></div>
  <img src="assets/brand/fatha-f.png">
  <div class="divider-line"></div>
</div>

<!-- CONTACT -->
<section class="section" id="contact">
  <h2>Contact</h2>
  <p>info@fathagames.com</p>

  <div class="socials">

    <!-- YouTube -->
    <a href="https://youtube.com/@fathagames" target="_blank">
      <svg viewBox="0 0 24 24">
        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.12-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.378.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.12 2.136C4.495 20.455 12 20.455 12 20.455s7.505 0 9.378-.505a3.015 3.015 0 0 0 2.12-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
      </svg>
    </a>

    <!-- Instagram -->
    <a href="https://instagram.com/fatha.games" target="_blank">
      <svg viewBox="0 0 24 24">
        <path d="M7 2C4.24 2 2 4.24 2 7v10c0 2.76 2.24 5 5 5h10c2.76 0 5-2.24 5-5V7c0-2.76-2.24-5-5-5H7zm10 2a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm-5 3.5A5.5 5.5 0 1 1 6.5 13 5.506 5.506 0 0 1 12 7.5zm0 2A3.5 3.5 0 1 0 15.5 13 3.5 3.5 0 0 0 12 9.5z"/>
      </svg>
    </a>

    <!-- Facebook -->
    <a href="https://facebook.com/share/1Di7zF4rcD/" target="_blank">
      <svg viewBox="0 0 24 24">
        <path d="M22 12a10 10 0 1 0-11.5 9.9v-7H8v-3h2.5V9.5c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.2c-1.2 0-1.6.7-1.6 1.6V12H17l-.5 3h-2.6v7A10 10 0 0 0 22 12z"/>
      </svg>
    </a>

  </div>
</section>

<!-- FOOTER -->
<footer class="footer container">
  <div>© 2026 Fatha Games</div>
  <div>
    <a href="privacy.html">Privacy</a> •
    <a href="terms.html">Terms</a>
  </div>
</footer>

</main>

</body>
</html>
