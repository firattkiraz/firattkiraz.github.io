<!DOCTYPE html>
<html lang="en">
<head>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-B9GTDBWJPV"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fatha Games</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* BASE */
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,system-ui;
  background:#fff;
  color:#0e1320;
}

a{color:inherit; text-decoration:none;}

.container{
  width:min(1100px,90%);
  margin:auto;
}

/* TOP */
.topbar{
  position:sticky;
  top:0;
  background:#fff;
  border-bottom:1px solid rgba(0,0,0,0.08);
}

.topbar-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
}

.nav{
  display:flex;
  gap:20px;
  font-size:14px;
  opacity:.7;
}

/* HERO */
.hero{
  text-align:center;
  padding:70px 0 40px;
}

.hero-logo{
  width:300px;
  max-width:85%;
}

.hero h1{
  font-size:44px;
  margin:0;
}

.hero p{
  margin-top:10px;
  color:rgba(0,0,0,0.6);
}

/* DIVIDER */
.divider{
  display:flex;
  align-items:center;
  gap:18px;
  margin:50px 0;
}

.divider-line{
  height:1px;
  flex:1;
  background:rgba(0,0,0,0.08);
}

.divider img{
  width:24px;
  opacity:.6;
}

/* SECTION */
.section{
  text-align:center;
  padding:40px 0;
}

.section h2{
  font-size:38px;
  margin-bottom:25px;
}

/* GAME */
.game-logo{
  width:240px;
  max-width:80%;
}

/* STORE */
.store-buttons{
  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
}

.store-btn{
  display:inline-block;
  transition:transform .25s ease;
}

.store-btn:hover{
  transform:translateY(-4px);
}

.store-btn img{
  height:52px !important;
  width:auto !important;
  object-fit:contain;
  display:block;
}

/* VIDEO */
.video-wrapper{
  width:100%;
  max-width:520px;
  margin:20px auto 0;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.video-wrapper iframe{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  display:block;
}

/* SOCIALS (FIXED — NO MORE STACKING) */
.socials{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  margin-top:15px;
  flex-wrap:wrap;
}

.socials a{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.05);
  border-radius:12px;
  transition:all .25s ease;
}

.socials svg{
  width:20px;
  height:20px;
  fill:#0e1320;
}

.socials a:hover{
  transform:translateY(-3px);
}

.socials a:nth-child(1):hover{ background:#FF0000; }
.socials a:nth-child(2):hover{ background:#E1306C; }
.socials a:nth-child(3):hover{ background:#1877F2; }

.socials a:hover svg{
  fill:#fff;
}

/* FOOTER */
.footer{
  margin-top:60px;
  padding:30px 0;
  border-top:1px solid rgba(0,0,0,0.08);
  display:flex;
  justify-content:space-between;
  font-size:13px;
  opacity:.7;
}

/* GLOBAL FIX */
img, svg{
  max-width:100%;
  height:auto;
}

</style>

</head>

<body>

<header class="topbar">
  <div class="container topbar-inner">
    <b>Fatha Games</b>
    <nav class="nav">
      <a href="#games">Games</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main class="container">

<section class="hero">
  <img class="hero-logo" src="assets/brand/fatha-f.png">
  <h1>Fatha Games</h1>
  <p>We build games with focus on feel, clarity, and execution.</p>
</section>

<div class="divider">
  <div class="divider-line"></div>
  <img src="assets/brand/fatha-f.png">
  <div class="divider-line"></div>
</div>

<section class="section" id="games">
  <h2>Games</h2>

  <div>Perfect Fit</div>

  <img class="game-logo" src="assets/games/perfect-fit/logo.png">

  <div class="store-buttons">

    <a class="store-btn"
       href="https://play.google.com/store/apps/details?id=com.FathaGames.PerfectFit"
       target="_blank">
      <img src="assets/google-play.png">
    </a>

    <a class="store-btn"
       href="https://apps.apple.com/us/app/perfect-fit-puzzle/id6772202390"
       target="_blank">
      <img src="assets/app-store.png">
    </a>

  </div>

  <!-- YOUTUBE VIDEO -->
  <div class="video-wrapper">
    <iframe
      src="https://www.youtube.com/embed/l2f48ydpf9c"
      allowfullscreen>
    </iframe>
  </div>

</section>

<div class="divider">
  <div class="divider-line"></div>
  <img src="assets/brand/fatha-f.png">
  <div class="divider-line"></div>
</div>

<section class="section" id="about">
  <h2>About</h2>
  <p style="color:rgba(0,0,0,0.6); line-height:1.8;">
    We focus on feel, clarity and execution.
  </p>
</section>

<div class="divider">
  <div class="divider-line"></div>
  <img src="assets/brand/fatha-f.png">
  <div class="divider-line"></div>
</div>

<section class="section" id="contact">
  <h2>Contact</h2>
  <p>info@fathagames.com</p>

  <div class="socials">

    <a href="https://youtube.com/@fathagames" target="_blank">
      <svg viewBox="0 0 24 24">
        <path d="M23.498 6.186a3...z"/>
      </svg>
    </a>

    <a href="https://instagram.com/fatha.games" target="_blank">
      <svg viewBox="0 0 24 24">
        <path d="M7 2C4...z"/>
      </svg>
    </a>

    <a href="https://facebook.com/share/1Di7zF4rcD/" target="_blank">
      <svg viewBox="0 0 24 24">
        <path d="M22 12a10...z"/>
      </svg>
    </a>

  </div>
</section>

<footer class="footer container">
  <div>© 2026 Fatha Games</div>
  <div>
    <a href="privacy.html">Privacy</a> •
    <a href="terms.html">Terms</a>
  </div>
</footer>

</main>

</body>
</html>
