<!DOCTYPE html>
<html lang="en">
<head>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-B9GTDBWJPV"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-B9GTDBWJPV');
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fatha Games</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter;
  background:#fff;
  color:#0e1320;
}

.container{
  width:min(1100px,90%);
  margin:auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
  padding:15px 0;
  border-bottom:1px solid rgba(0,0,0,0.1);
}

.nav{
  display:flex;
  gap:20px;
  font-size:14px;
  opacity:.7;
}

/* HERO */
.hero{
  text-align:center;
  padding:50px 0;
}

.hero-logo{
  width:240px;
  max-width:80%;
}

/* GAME */
.game-logo{
  width:200px;
}

/* STORE BUTTONS (FIXED) */
.store-buttons{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:15px;
}

.store-btn img{
  height:48px !important;
  width:auto !important;
  max-height:48px !important;
  object-fit:contain;
}

/* SOCIALS (RESTORED) */
.socials{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:10px;
}

.socials a{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.05);
  border-radius:10px;
}

.socials svg{
  width:20px !important;
  height:20px !important;
}

/* FOOTER */
.footer{
  margin-top:40px;
  padding:25px 0;
  border-top:1px solid rgba(0,0,0,0.1);
  display:flex;
  justify-content:space-between;
  font-size:13px;
  opacity:.7;
}

/* GLOBAL SAFETY FIX */
img, svg{
  max-width:100%;
  height:auto;
}

</style>

<script>
function trackStore(type,url){
  gtag('event','click_store',{platform:type});
  window.open(url,'_blank');
}
</script>

</head>

<body>

<header class="topbar container">
  <div><b>Fatha Games</b></div>
  <div class="nav">
    <a href="#games">Games</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </div>
</header>

<main class="container">

<!-- HERO -->
<section class="hero">
  <img class="hero-logo" src="assets/brand/fatha-f.png">
  <h1>Fatha Games</h1>
</section>

<!-- GAMES -->
<section id="games" style="text-align:center">
  <h2>Perfect Fit</h2>

  <img class="game-logo" src="assets/games/perfect-fit/logo.png">

  <div class="store-buttons">

    <a class="store-btn"
       href="javascript:void(0)"
       onclick="trackStore('android','https://play.google.com/store/apps/details?id=com.FathaGames.PerfectFit')">
      <img src="assets/google-play.png">
    </a>

    <a class="store-btn"
       href="javascript:void(0)"
       onclick="trackStore('ios','https://apps.apple.com/us/app/perfect-fit-puzzle/id6772202390')">
      <img src="assets/app-store.png">
    </a>

  </div>
</section>

<!-- ABOUT -->
<section id="about" style="text-align:center; margin-top:40px">
  <h2>About</h2>
  <p>We build games with focus on feel and execution.</p>
</section>

<!-- CONTACT -->
<section id="contact" style="text-align:center; margin-top:40px">

  <h2>Contact</h2>
  <p>info@fathagames.com</p>

  <div class="socials">

    <a href="https://youtube.com/@fathagames" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M23.5 6.2..."/></svg>
    </a>

    <a href="https://instagram.com/fatha.games" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M7 2C4..."/></svg>
    </a>

    <a href="https://facebook.com/share/1Di7zF4rcD/" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M22 12..."/></svg>
    </a>

  </div>

</section>

<footer class="footer container">
  <div>© 2026 Fatha Games</div>
  <div>
    <a href="privacy.html">Privacy</a> •
    <a href="terms.html">Terms</a>
  </div>
</footer>

</main>

</body>
</html>
