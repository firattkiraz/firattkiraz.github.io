<!DOCTYPE html>
<html lang="en">
<head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-B9GTDBWJPV"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-B9GTDBWJPV');
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fatha Games</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/brand/favicon.png">

<style>
:root{
  --text:#0e1320;
  --muted:rgba(14,19,32,0.65);
  --line:rgba(14,19,32,0.10);
  --accent:#1b4fa3;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:#ffffff;
  color:var(--text);
}

a{ text-decoration:none; color:inherit; }

.container{
  width:min(1100px,calc(100% - 48px));
  margin:0 auto;
}

/* NAV */
.topbar{
  position:sticky;
  top:0;
  background:#fff;
  border-bottom:1px solid var(--line);
}

.topbar-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
}

/* HERO */
.hero{
  text-align:center;
  padding:60px 0 40px;
}

.hero-logo{
  width:360px;
  max-width:90%;
}

.hero h1{
  font-size:44px;
}

/* STORE BUTTONS */
.store-buttons{
  display:flex;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
}

.store-btn img{
  height:60px;
}
/* ICON FIX */
img, svg {
  max-width: 100%;
  height: auto;
}

.store-btn img {
  height: 52px;
  width: auto;
  object-fit: contain;
}

.socials svg {
  width: 20px;
  height: 20px;
}
/* FOOTER */
.footer{
  border-top:1px solid var(--line);
  padding:40px 0;
  text-align:center;
  color:var(--muted);
}
</style>

<!-- =========================
GA EVENTS
========================= -->
<script>
function trackStore(platform, url){

  gtag('event', 'click_store', {
    platform: platform
  });

  window.open(url, '_blank');
}

/* QR tracking */
(function(){
  const params = new URLSearchParams(window.location.search);

  if(params.get("utm_source") === "qr"){
    gtag('event', 'qr_visit', {
      campaign: params.get("utm_campaign") || "unknown"
    });
  }
})();
</script>

</head>

<body>

<header class="topbar">
  <div class="container topbar-inner">
    <div class="brand">
      <img src="assets/brand/fatha-f.png" width="26">
      Fatha Games
    </div>
  </div>
</header>

<main class="container">

  <section class="hero">
    <img class="hero-logo" src="assets/brand/fatha-f.png">
    <h1>Fatha Games</h1>
    <p>We build games with a strong focus on feel, clarity, and execution.</p>
  </section>

  <section style="text-align:center; padding:40px 0;">

    <h2>Perfect Fit</h2>

    <div class="store-buttons">

      <!-- ANDROID -->
      <a href="javascript:void(0)"
         onclick="trackStore('android','https://play.google.com/store/apps/details?id=com.FathaGames.PerfectFit')">
        <img src="assets/google-play.png">
      </a>

      <!-- IOS -->
      <a href="javascript:void(0)"
         onclick="trackStore('ios','https://apps.apple.com/us/app/perfect-fit-puzzle/id6772202390')">
        <img src="assets/app-store.png">
      </a>

    </div>

  </section>

</main>

<footer class="footer">
  © 2026 Fatha Games
</footer>

</body>
</html>
